name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-engine.txt

      - name: Install engine dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-engine.txt

      - name: Install verified opening book
        run: python books/install_gm2001.py

      - name: Compile Python sources
        run: python -m compileall -q backend benchmarks books engine ml tests

      - name: Run test suite
        run: python -m unittest discover -s tests -v
